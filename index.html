        /* Custom geometric clinical overlay & glassmorphism matching reference aesthetic */
        .hero-bg {
            background-color: #0A192F;

                radial-gradient(circle at 85% 20%, rgba(0, 180, 162, 0.22) 0%, transparent 45%),
                linear-gradient(105deg, rgba(10, 25, 47, 0.96) 0%, rgba(10, 25, 47, 0.85) 52%, rgba(10, 25, 47, 0.45) 100%),

            background-size: cover;
            background-position: center right;
        }

            background-image: url("data:image/svg+xml,%3Csvg width='160' height='160' viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon points='0,0 80,0 0,80' fill='%2300B4A2' fill-opacity='0.14'/%3E%3Cpolygon points='80,0 160,80 80,80' fill='%2300B4A2' fill-opacity='0.09'/%3E%3Cpolygon points='0,80 80,80 80,160' fill='%231D3557' fill-opacity='0.28'/%3E%3Cpolygon points='80,80 160,80 160,160' fill='%2300B4A2' fill-opacity='0.18'/%3E%3C/svg%3E");

            background: rgba(255, 255, 255, 0.14);

            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), background 0.3s ease, border-color 0.3s ease, box-shadow 0.35s ease;

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.45);
            transform: translateY(-4px);
            box-shadow: 0 20px 35px -10px rgba(0, 180, 162, 0.25);
        }

        /* High-Craft Motion Keyframes */
        @keyframes floatAmbient {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            50% { transform: translate3d(14px, -10px, 0) scale(1.03); }
            100% { transform: translate3d(-8px, 12px, 0) scale(1.01); }
        }

        @keyframes heroStaggerUp {
            from {
                opacity: 0;
                transform: translate3d(0, 26px, 0);
            }
            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        @keyframes springModalIn {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(16px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes tabSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseBeacon {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.65); opacity: 0; }
        }

        @keyframes toastProgress {
            from { width: 100%; }
            to { width: 0%; }
        }

        @keyframes rowHighlight {
            0% { background-color: rgba(0, 180, 162, 0.22); }
            100% { background-color: transparent; }
        }

        .animate-hero-1 { animation: heroStaggerUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .animate-hero-2 { animation: heroStaggerUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both; }
        .animate-hero-3 { animation: heroStaggerUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.24s both; }
        .animate-hero-4 { animation: heroStaggerUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.36s both; }
        .animate-modal-spring { animation: springModalIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .animate-tab-view { animation: tabSlideIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .animate-row-new { animation: rowHighlight 2.2s ease-out forwards; }

        .emergency-beacon::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.65);
            animation: pulseBeacon 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Scroll Reveal Utility Classes */
        .reveal-on-scroll {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);

        .reveal-on-scroll.is-visible {
            opacity: 1;

        /* 3D Interactive Card Tilt & Canvas Styling */

            transform-style: preserve-3d;

                color: black !important;
                padding: 24px;
            }
            .no-print {
                display: none !important;

        const Security = {
            // Deterministic hash simulation for password verification (never storing plaintext comparison directly in UI)
            hashPassword(raw) {
                let hash = 5381;
                const salted = `cliniq_salt_2026_${raw}`;
                for (let i = 0; i < salted.length; i++) {
                    hash = ((hash << 5) + hash) + salted.charCodeAt(i);
                }
                return 'sha256_' + Math.abs(hash).toString(16).padStart(8, '0');
            },
            sanitize(str) {
                if (typeof str !== 'string') return str;
                const div = document.createElement('div');
                div.textContent = str.trim();
                return div.innerHTML;
            },
            maskId(id) {

        class HMSStore {
            constructor() {
                this.state = this.load();
                this.session = this.loadSession();
            }

            load() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(InitialSeedData));
                        return JSON.parse(JSON.stringify(InitialSeedData));
                    }
                    const parsed = JSON.parse(raw);
                    // Ensure primary Admin account is always synced to AHAD
                    const admIdx = parsed.users?.findIndex(u => u.userId === 'USR-ADM-01');
                    if (admIdx !== undefined && admIdx !== -1) {
                        parsed.users[admIdx].username = 'AHAD';
                        parsed.users[admIdx].fullName = 'AHAD';
                        parsed.users[admIdx].passwordHash = Security.hashPassword('ahad123');
                    }
                    return parsed;
                } catch (e) {
                    return JSON.parse(JSON.stringify(InitialSeedData));
                }
            }

            save() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
                } catch (e) {
                    showToast('Storage quota warning: Unable to persist changes locally.', 'error');
                }
            }

            loadSession() {
                try {
                    const s = sessionStorage.getItem('cliniq_active_session');
                    return s ? JSON.parse(s) : null;
                } catch {
                    return null;
                }
            }

            saveSession(userObj) {
                this.session = userObj;
                if (userObj) {
                    sessionStorage.setItem('cliniq_active_session', JSON.stringify(userObj));
                } else {
                    sessionStorage.removeItem('cliniq_active_session');
                }
            }

            logAudit(actorRole, actorName, action, details) {
                const entry = {
                    id: 'LOG-' + Math.floor(1000 + Math.random() * 9000),
                    timestamp: new Date().toLocaleString(),
                    actorRole,
                    actorName,
                    action,
                    details
                };
                this.state.auditLogs.unshift(entry);
                if (this.state.auditLogs.length > 100) this.state.auditLogs.pop();
                this.save();
            }

            resetDatabase() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(InitialSeedData));
                this.state = JSON.parse(JSON.stringify(InitialSeedData));
                this.logAudit('ADMIN', this.session?.fullName || 'System', 'DATABASE_RESET', 'Hospital clinical datasets restored to baseline.');
            }
        }

        const store = new HMSStore();

        // ==========================================
        // 3. UI FEEDBACK & MODAL HELPERS
        // ==========================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const id = 'toast-' + Date.now();
            const styles = {
                success: 'bg-navy-900 text-white border-l-4 border-teal-500',
                error: 'bg-rose-950 text-white border-l-4 border-rose-500',
                warning: 'bg-amber-950 text-white border-l-4 border-amber-400'
            };
            const icons = {
                success: `<svg class="w-5 h-5 text-teal-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`,
                error: `<svg class="w-5 h-5 text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>`,
                warning: `<svg class="w-5 h-5 text-amber-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`
            };

            const toast = document.createElement('div');
            toast.id = id;
            toast.className = `pointer-events-auto relative overflow-hidden flex items-start gap-3 p-4 rounded-xl shadow-2xl transition-all duration-300 transform translate-x-0 animate-tab-view ${styles[type] || styles.success}`;
            toast.innerHTML = `
                ${icons[type] || icons.success}
                <div class="text-sm font-medium leading-snug flex-1">${message}</div>
                <button onclick="document.getElementById('${id}')?.remove()" class="text-slate-400 hover:text-white">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
                <div class="absolute bottom-0 left-0 h-0.5 bg-teal-400/80" style="animation: toastProgress 4.2s linear forwards;"></div>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(24px)';
                setTimeout(() => toast.remove(), 300);
            }, 4200);
        }

        function closeModal() {
            document.getElementById('modal-root').innerHTML = '';

        function openModal(htmlContent) {
            const root = document.getElementById('modal-root');
            root.innerHTML = `

                </div>
            `;
        }

        // ==========================================
        // 4. ROLE-BASED ACCESS CONTROL ENGINE (FR1)
        // ==========================================
        const AuthController = {
            attemptLogin(username, password, expectedRole) {
                const rawSanitized = Security.sanitize(username);
                const cleanUser = rawSanitized.toLowerCase();
                const hashed = Security.hashPassword(password);

                const account = store.state.users.find(u => u.username.toLowerCase() === cleanUser);

                if (!account) {
                    store.logAudit('ANONYMOUS', rawSanitized || 'Unknown', 'LOGIN_FAILED', 'Account identifier not found.');
                    return { ok: false, error: 'Invalid credentials. No registered hospital account matches this ID.' };
                }

                if (!account.active) {
                    store.logAudit(account.role, account.fullName, 'LOGIN_BLOCKED', 'Attempted login to deactivated account.');
                    return { ok: false, error: 'Account suspended. Contact Hospital Systems Administrator (AHAD).' };
                }

                if (account.passwordHash !== hashed) {
                    store.logAudit(account.role, account.fullName, 'LOGIN_FAILED', 'Invalid password signature.');
                    return { ok: false, error: 'Authentication failed. Incorrect password provided.' };
                }

                // STRICT ROLE VERIFICATION: Prevents Patient logging into Admin/Doctor/Staff or vice versa
                if (expectedRole && account.role !== expectedRole) {
                    store.logAudit(account.role, account.fullName, 'RBAC_VIOLATION_BLOCKED', `User with role [${account.role}] attempted unauthorized entry into [${expectedRole}] portal.`);
                    return {
                        ok: false,
                        error: `Access Denied (Role Conflict): Your credentials belong to the ${account.role} role and cannot access the ${expectedRole} portal.`
                    };
                }

                // Create sanitized session object without passwordHash
                const { passwordHash, ...safeSession } = account;
                store.saveSession(safeSession);
                store.logAudit(account.role, account.fullName, 'LOGIN_SUCCESS', `Authenticated into ${account.role} workspace.`);
                return { ok: true, user: safeSession };
            },

            logout() {
                if (store.session) {
                    store.logAudit(store.session.role, store.session.fullName, 'LOGOUT', 'Session terminated cleanly.');
                }
                store.saveSession(null);
                AppState.activeTab = 'overview';
                renderApp();
                showToast('You have been securely logged out.', 'success');
            },

            // Route / Action Guard verifying current session holds required role(s)
            guard(allowedRoles) {
                if (!store.session) return false;
                return allowedRoles.includes(store.session.role);
            }
        };

        // ==========================================
        // 5. CORE CLINICAL & OPERATIONAL MODULES
        // ==========================================
        const ClinicalEngine = {
            // FR2: Authorized Staff / Admin registers a patient with duplicate & integrity checks
            registerPatient(payload) {
                if (!AuthController.guard(['STAFF', 'ADMIN'])) {
                    showToast('Security Violation: Only Authorized Staff or Admin can create patient records.', 'error');
                    return false;
                }

                const fullName = Security.sanitize(payload.fullName);
                const email = Security.sanitize(payload.email).toLowerCase();
                const phone = Security.sanitize(payload.phone);
                const age = parseInt(payload.age, 10);
                const gender = Security.sanitize(payload.gender);
                const bloodGroup = Security.sanitize(payload.bloodGroup);
                const address = Security.sanitize(payload.address);
                const medicalHistory = Security.sanitize(payload.medicalHistory) || 'No prior conditions reported.';

                if (!fullName || !email || !phone || isNaN(age) || age < 0 || age > 130) {
                    showToast('Validation Error: Please enter valid patient name, email, phone, and age.', 'error');
                    return false;
                }

                // NFR4: Duplicate prevention check
                const duplicate = store.state.patients.find(p => p.email.toLowerCase() === email || p.phone === phone);
                if (duplicate) {
                    showToast(`Duplicate Record Prevented: Patient already exists (${duplicate.patientId} - ${duplicate.fullName}).`, 'error');
                    return false;
                }

                const nextNum = String(store.state.patients.length + 1).padStart(3, '0');
                const patientId = `PAT-2026-${nextNum}`;
                const userId = `USR-PAT-${nextNum}`;

                const newPatient = {
                    patientId,
                    userId,
                    fullName,
                    age,
                    gender,
                    bloodGroup,
                    phone,
                    email,
                    address,
                    medicalHistory,
                    registeredAt: getTodayISO(0),
                    registeredBy: store.session.staffId || store.session.userId
                };

                // Also provision Patient portal login account automatically
                const newUser = {
                    userId,
                    patientId,
                    username: email,
                    passwordHash: Security.hashPassword(payload.initialPassword || 'Patient@123'),
                    role: 'PATIENT',
                    fullName,
                    active: true
                };

                store.state.patients.unshift(newPatient);
                store.state.users.push(newUser);
                store.logAudit(store.session.role, store.session.fullName, 'PATIENT_REGISTERED', `Created patient record ${patientId} for ${fullName}.`);
                store.save();
                showToast(`Patient Registered! Unique ID: ${patientId}`, 'success');
                return true;
            },

            // FR3: Conflict-Free Appointment Scheduling Engine
            isSlotTaken(doctorId, date, timeSlot, patientId = null) {
                return store.state.appointments.some(apt => {
                    if (apt.status === 'Cancelled') return false;
                    const sameDateTime = apt.date === date && apt.timeSlot === timeSlot;
                    if (!sameDateTime) return false;
                    // Conflict if Doctor is already booked OR Patient already has an appointment at same time
                    return apt.doctorId === doctorId || (patientId && apt.patientId === patientId);
                });
            },

            bookAppointment({ patientId, doctorId, date, timeSlot, reason }) {
                if (!AuthController.guard(['PATIENT', 'STAFF', 'ADMIN'])) {
                    showToast('Unauthorized action: Cannot schedule appointments from current role.', 'error');
                    return false;
                }

                // If logged in as Patient, force patientId to be strictly their own ID (zero cross-patient booking)
                const effectivePatientId = store.session.role === 'PATIENT' ? store.session.patientId : patientId;
                const patient = store.state.patients.find(p => p.patientId === effectivePatientId);
                const doctor = store.state.users.find(u => u.role === 'DOCTOR' && u.doctorId === doctorId);

                if (!patient || !doctor || !date || !timeSlot) {
                    showToast('Validation Error: Select a valid patient, doctor, date, and time slot.', 'error');
                    return false;
                }

                // Real-time Conflict Check
                if (this.isSlotTaken(doctorId, date, timeSlot, effectivePatientId)) {
                    showToast(`Scheduling Conflict: ${doctor.fullName} or patient is unavailable on ${date} at ${timeSlot}.`, 'error');
                    return false;
                }

                const newApt = {
                    appointmentId: 'APT-' + Math.floor(1000 + Math.random() * 9000),
                    patientId: patient.patientId,
                    patientName: patient.fullName,
                    doctorId: doctor.doctorId,
                    doctorName: doctor.fullName,
                    department: doctor.specialization,
                    date,
                    timeSlot,
                    reason: Security.sanitize(reason) || 'General Clinical Consultation',
                    status: 'Scheduled',
                    createdAt: getTodayISO(0)
                };

                store.state.appointments.unshift(newApt);
                store.logAudit(store.session.role, store.session.fullName, 'APPOINTMENT_BOOKED', `Scheduled ${newApt.appointmentId} (${patient.patientId} with ${doctor.fullName} on ${date} @ ${timeSlot}).`);
                store.save();
                showToast(`Appointment Confirmed (${newApt.appointmentId}) for ${date} at ${timeSlot}.`, 'success');
                return true;
            },

            cancelAppointment(appointmentId) {
                const apt = store.state.appointments.find(a => a.appointmentId === appointmentId);
                if (!apt) return;

                // Role ownership check
                if (store.session.role === 'PATIENT' && apt.patientId !== store.session.patientId) {
                    showToast('Access Denied: You can only cancel your own appointments.', 'error');
                    return;
                }
                if (store.session.role === 'DOCTOR' && apt.doctorId !== store.session.doctorId) {
                    showToast('Access Denied: Appointment belongs to another specialist.', 'error');
                    return;
                }

                apt.status = 'Cancelled';
                store.logAudit(store.session.role, store.session.fullName, 'APPOINTMENT_CANCELLED', `Cancelled appointment ${appointmentId}.`);
                store.save();
                showToast(`Appointment ${appointmentId} has been cancelled.`, 'warning');
                renderApp();
            },

            // FR4: Doctor issues Digital Prescription
            createPrescription({ appointmentId, diagnosis, medicines, instructions }) {
                if (!AuthController.guard(['DOCTOR'])) {
                    showToast('Access Denied: Only licensed Doctors can issue clinical prescriptions.', 'error');
                    return false;
                }

                const apt = store.state.appointments.find(a => a.appointmentId === appointmentId);
                if (!apt || apt.doctorId !== store.session.doctorId) {
                    showToast('Security Violation: Appointment not assigned to your clinical schedule.', 'error');
                    return false;
                }

                if (!diagnosis || !medicines || medicines.length === 0) {
                    showToast('Validation Error: Diagnosis and at least one medication are required.', 'error');
                    return false;
                }

                const rx = {
                    prescriptionId: 'RX-' + Math.floor(1000 + Math.random() * 9000),
                    appointmentId: apt.appointmentId,
                    patientId: apt.patientId,
                    patientName: apt.patientName,
                    doctorId: store.session.doctorId,
                    doctorName: store.session.fullName,
                    diagnosis: Security.sanitize(diagnosis),
                    medicines: medicines.map(m => ({
                        name: Security.sanitize(m.name),
                        dosage: Security.sanitize(m.dosage),
                        frequency: Security.sanitize(m.frequency),
                        duration: Security.sanitize(m.duration)
                    })),
                    instructions: Security.sanitize(instructions) || 'Follow prescribed dosage strictly.',
                    issuedDate: getTodayISO(0)
                };

                store.state.prescriptions.unshift(rx);
                apt.status = 'Completed';
                store.logAudit('DOCTOR', store.session.fullName, 'PRESCRIPTION_ISSUED', `Issued ${rx.prescriptionId} for patient ${apt.patientId}.`);
                store.save();
                showToast(`Digital Prescription ${rx.prescriptionId} attached to patient record.`, 'success');
                return true;
            },

            // FR5: Staff generates itemized Invoice
            generateInvoice({ patientId, appointmentId, items }) {
                if (!AuthController.guard(['STAFF', 'ADMIN'])) {
                    showToast('Access Denied: Only Authorized Billing Staff can generate invoices.', 'error');
                    return false;
                }

                const patient = store.state.patients.find(p => p.patientId === patientId);
                if (!patient || !items || items.length === 0) {
                    showToast('Validation Error: Patient and valid billing line items are required.', 'error');
                    return false;
                }

                const sanitizedItems = items.map(it => ({
                    description: Security.sanitize(it.description),
                    category: Security.sanitize(it.category || 'Service'),
                    amount: Math.max(0, parseFloat(it.amount) || 0)
                })).filter(it => it.description && it.amount > 0);

                if (sanitizedItems.length === 0) {
                    showToast('Validation Error: Enter at least one valid charge greater than ₹0.', 'error');
                    return false;
                }

                const totalAmount = sanitizedItems.reduce((sum, i) => sum + i.amount, 0);

                const inv = {
                    invoiceId: 'INV-' + Math.floor(1000 + Math.random() * 9000),
                    appointmentId: appointmentId || 'DIRECT',
                    patientId: patient.patientId,
                    patientName: patient.fullName,
                    items: sanitizedItems,
                    totalAmount,
                    paymentStatus: 'Unpaid',
                    paymentMethod: null,
                    receiptRefNo: null,
                    createdAt: getTodayISO(0),
                    paidAt: null
                };

                store.state.invoices.unshift(inv);
                store.logAudit(store.session.role, store.session.fullName, 'INVOICE_GENERATED', `Generated ${inv.invoiceId} (₹${totalAmount}) for ${patient.patientId}.`);
                store.save();
                showToast(`Invoice ${inv.invoiceId} created for ₹${totalAmount.toLocaleString()}.`, 'success');
                return true;
            },

            // FR5: Process Payment & Generate Unique Receipt Reference Number
            recordPayment(invoiceId, paymentMethod) {
                const inv = store.state.invoices.find(i => i.invoiceId === invoiceId);
                if (!inv) return false;

                // Patients can only pay their own invoices; Staff/Admin can record any payment
                if (store.session.role === 'PATIENT' && inv.patientId !== store.session.patientId) {
                    showToast('Security Violation: Unauthorized invoice payment attempt blocked.', 'error');
                    return false;
                }
                if (!AuthController.guard(['PATIENT', 'STAFF', 'ADMIN'])) {
                    showToast('Access Denied: Current role cannot process financial transactions.', 'error');
                    return false;
                }

                if (inv.paymentStatus === 'Paid') {
                    showToast('Invoice is already settled.', 'warning');
                    return false;
                }

                const receiptRefNo = 'RCP-' + new Date().getFullYear() + '-' + Math.floor(100000 + Math.random() * 900000);
                inv.paymentStatus = 'Paid';
                inv.paymentMethod = Security.sanitize(paymentMethod) || 'UPI / Card';
                inv.receiptRefNo = receiptRefNo;
                inv.paidAt = new Date().toLocaleString();

                store.logAudit(store.session.role, store.session.fullName, 'PAYMENT_SETTLED', `Settled ${inv.invoiceId} via ${inv.paymentMethod}. Receipt: ${receiptRefNo}.`);
                store.save();
                showToast(`Payment Successful! Receipt Ref: ${receiptRefNo}`, 'success');
                return true;
            }
        };

        // 6. APPLICATION STATE & ROUTER

                        <!-- Recent Security & Operational Audit Trail -->
                        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">

                            <div class="divide-y divide-slate-100">
                                ${logs.slice(0, 6).map(l => `
                                    <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">

            if (AppState.activeTab === 'users') {
                return `

                                            <td class="py-3.5 px-6">

                                                ${u.userId !== user.userId ? `

            if (AppState.activeTab === 'audit') {
                return `
                    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                        <div class="p-6 border-b border-slate-100">
                            <h2 class="text-lg font-extrabold text-navy-900">Complete Security & Transaction Audit Log (NFR1 / NFR2)</h2>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-50 uppercase text-slate-500">
                                    <tr>
                                        <th class="py-3 px-5">Timestamp</th>
                                        <th class="py-3 px-5">Event Type</th>
                                        <th class="py-3 px-5">Actor & Role</th>
                                        <th class="py-3 px-5">Event Description</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${logs.map(l => `
                                        <tr>
                                            <td class="py-3 px-5 font-mono text-slate-500 whitespace-nowrap">${l.timestamp}</td>
                                            <td class="py-3 px-5">
                                                <span class="px-2 py-0.5 rounded font-bold ${l.action.includes('BLOCKED') || l.action.includes('FAILED') ? 'bg-rose-100 text-rose-800' : 'bg-teal-50 text-teal-800'}">${l.action}</span>
                                            </td>
                                            <td class="py-3 px-5 font-semibold text-navy-900">${l.actorName} [${l.actorRole}]</td>
                                            <td class="py-3 px-5 text-slate-600">${l.details}</td>

            }
        }

        function toggleUserStatus(targetUserId) {
            if (!AuthController.guard(['ADMIN'])) return;
            const target = store.state.users.find(u => u.userId === targetUserId);
            if (!target) return;
            target.active = !target.active;
            store.logAudit('ADMIN', store.session.fullName, 'ACCOUNT_STATUS_CHANGED', `${target.active ? 'Activated' : 'Suspended'} user ${target.username} (${target.role}).`);
            store.save();
            renderApp();
            showToast(`Account ${target.username} is now ${target.active ? 'Active' : 'Suspended'}.`, 'success');
        }

        // ==========================================
        // 10. MAIN RENDER LOOP
        // ==========================================
        // 10. MAIN RENDER LOOP & SCROLL OBSERVERS
        // ==========================================
        let hero3DAnimId = null;

        function initHero3DScene() {
            const canvas = document.getElementById('hero-3d-canvas');
            const stage = document.getElementById('hero-3d-stage');
            if (!canvas || !stage) return;

            if (hero3DAnimId) {
                cancelAnimationFrame(hero3DAnimId);
                hero3DAnimId = null;
            }

            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            let width = 560;
            let height = 440;

            function resizeCanvas() {
                if (!stage || !canvas) return;
                const rect = stage.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                width = Math.max(1, rect.width);
                height = Math.max(1, rect.height);
                canvas.width = Math.round(width * dpr);
                canvas.height = Math.round(height * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            resizeCanvas();

            // Uniform 3D Vector Math & Aspect-Ratio-Locked Perspective Projection
            function rotatePoint(p, rx, ry, rz) {
                let { x, y, z } = p;
                const cy = Math.cos(rx), sy = Math.sin(rx);
                const y1 = y * cy - z * sy;
                const z1 = y * sy + z * cy;
                y = y1; z = z1;

                const cx = Math.cos(ry), sx = Math.sin(ry);
                const x2 = x * cx + z * sx;
                const z2 = -x * sx + z * cx;
                x = x2; z = z2;

                const cz = Math.cos(rz), sz = Math.sin(rz);
                const x3 = x * cz - y * sz;
                const y3 = x * sz + y * cz;
                return { x: x3, y: y3, z };
            }

            // Symmetric focal length ensures zero stretching on ultrawide or full-screen displays
            function project3D(p, focalLength = 640) {
                const scale = focalLength / (focalLength + p.z);
                return {
                    x: width * 0.5 + p.x * scale,
                    y: height * 0.5 + p.y * scale,
                    z: p.z,
                    scale
                };
            }

            // Build 3D Cylinder Mesh helper
            function createCylinderPolygons(radiusTop, radiusBottom, h, segments, colorFn, offset, rot, stroke = null) {
                const polys = [];
                const halfH = h / 2;
                for (let i = 0; i < segments; i++) {
                    const a0 = (i / segments) * Math.PI * 2;
                    const a1 = ((i + 1) / segments) * Math.PI * 2;
                    const midA = (a0 + a1) * 0.5;

                    const pts = [
                        { x: Math.cos(a0) * radiusTop, y: -halfH, z: Math.sin(a0) * radiusTop },
                        { x: Math.cos(a1) * radiusTop, y: -halfH, z: Math.sin(a1) * radiusTop },
                        { x: Math.cos(a1) * radiusBottom, y: halfH, z: Math.sin(a1) * radiusBottom },
                        { x: Math.cos(a0) * radiusBottom, y: halfH, z: Math.sin(a0) * radiusBottom }
                    ].map(v => {
                        const r = rotatePoint(v, rot.x, rot.y, rot.z);
                        return { x: r.x + offset.x, y: r.y + offset.y, z: r.z + offset.z };
                    });

                    polys.push({
                        pts,
                        fill: colorFn(midA),
                        stroke
                    });
                }
                return polys;
            }

            // Build Circular Cap Disk for Cylinder Ends
            function createCapPolygon(radius, yPos, segments, fill, offset, rot, stroke = null) {
                const pts = [];
                for (let i = 0; i < segments; i++) {
                    const a = (i / segments) * Math.PI * 2;
                    const r = rotatePoint({ x: Math.cos(a) * radius, y: yPos, z: Math.sin(a) * radius }, rot.x, rot.y, rot.z);
                    pts.push({ x: r.x + offset.x, y: r.y + offset.y, z: r.z + offset.z });
                }
                return [{ pts, fill, stroke }];
            }

            const resizeObserver = typeof ResizeObserver !== 'undefined'
                ? new ResizeObserver(() => resizeCanvas())
                : null;
            if (resizeObserver) resizeObserver.observe(stage);
            window.addEventListener('resize', resizeCanvas, { passive: true });

            const startTime = performance.now();

            function renderFrame(now) {
                if (!document.getElementById('hero-3d-canvas')) {
                    window.removeEventListener('resize', resizeCanvas);
                    if (resizeObserver) resizeObserver.disconnect();
                    return;
                }

                hero3DAnimId = requestAnimationFrame(renderFrame);
                const t = (now - startTime) * 0.001;

                // Uniform scale driven strictly by height so wide screens never distort proportions
                const scaleFactor = Math.min(Math.max(height / 315, 0.95), 1.48);

                ctx.clearRect(0, 0, width, height);

                const scenePolys = [];

                // Smooth, executive ambient floating & gentle 3D rotation
                const floatY = Math.sin(t * 1.35) * 11;
                const pump = (Math.sin(t * 1.65) + 1) * 16; // Smooth fluid draw/dispense cycle
                const syrOffset = { x: 10, y: -6 + floatY, z: 0 };
                const syrRot = {
                    x: 0.24 + Math.sin(t * 0.7) * 0.07,
                    y: Math.sin(t * 0.65) * 0.32 + 0.35,
                    z: -0.62 + Math.cos(t * 0.55) * 0.04
                };

                function toWorld(localPt) {
                    const r = rotatePoint(localPt, syrRot.x, syrRot.y, syrRot.z);
                    return {
                        x: (r.x + syrOffset.x) * scaleFactor,
                        y: (r.y + syrOffset.y) * scaleFactor,
                        z: (r.z + syrOffset.z) * scaleFactor
                    };
                }

                function pushCylinder(rTop, rBot, h, segs, colorFn, localY, stroke = null) {
                    const raw = createCylinderPolygons(rTop, rBot, h, segs, colorFn, { x: 0, y: localY, z: 0 }, { x: 0, y: 0, z: 0 }, stroke);
                    for (const poly of raw) {
                        scenePolys.push({
                            pts: poly.pts.map(toWorld),
                            fill: poly.fill,
                            stroke: poly.stroke
                        });
                    }
                }

                function pushCap(r, localY, segs, fill, stroke = null) {
                    const raw = createCapPolygon(r, localY, segs, fill, { x: 0, y: 0, z: 0 }, { x: 0, y: 0, z: 0 }, stroke);
                    for (const poly of raw) {
                        scenePolys.push({
                            pts: poly.pts.map(toWorld),
                            fill: poly.fill,
                            stroke: poly.stroke
                        });
                    }
                }

                // 1. Plunger Thumb Press Flange (Teal Anodized Finish)
                pushCylinder(26, 26, 6, 24,
                    a => `hsl(174, 86%, ${42 + Math.cos(a) * 18}%)`,
                    -132 + pump, 'rgba(255,255,255,0.18)'
                );
                pushCap(26, -135 + pump, 24, '#2DD4BF', 'rgba(255,255,255,0.25)');

                // 2. Precision Plunger Shaft (Polished Chrome)
                pushCylinder(6.5, 6.5, 86, 16,
                    a => `hsl(212, 24%, ${74 + Math.cos(a) * 20}%)`,
                    -88 + pump
                );

                // 3. Dual-Seal Medical Rubber Stopper
                pushCylinder(19.2, 19.2, 13, 24,
                    a => `hsl(218, 48%, ${14 + Math.cos(a) * 9}%)`,
                    -44 + pump
                );
                pushCap(19.2, -50.5 + pump, 24, '#0F172A');

                // 4. Luminous Teal Clinical Fluid Chamber
                const serumH = Math.max(28, 78 - pump);
                const serumCenterY = 41 - serumH * 0.5;
                pushCylinder(18.6, 18.6, serumH, 24,
                    a => `hsla(174, 94%, ${46 + Math.cos(a) * 18}%, 0.9)`,
                    serumCenterY
                );
                pushCap(18.6, serumCenterY - serumH * 0.5, 24, 'rgba(94, 234, 212, 0.92)');

                // 5. Ergonomic Barrel Finger Flange
                pushCylinder(33, 33, 6, 28,
                    a => `rgba(241, 245, 249, ${0.78 + Math.cos(a) * 0.18})`,
                    -68, 'rgba(255,255,255,0.28)'
                );
                pushCap(33, -71, 28, 'rgba(226, 232, 240, 0.65)');

                // 6. Borosilicate Translucent Glass Barrel with Specular Sheen
                pushCylinder(21.5, 21.5, 114, 28,
                    a => {
                        const spec = Math.pow(Math.max(0, Math.cos(a - 0.5)), 4);
                        return `rgba(224, 242, 254, ${0.18 + spec * 0.42})`;
                    },
                    -11, 'rgba(255, 255, 255, 0.14)'
                );

                // 7. Luer-Lock Collar & Tapered Nozzle Tip
                pushCylinder(13, 9.5, 16, 20,
                    a => `hsl(174, 88%, ${38 + Math.cos(a) * 16}%)`,
                    54, 'rgba(255,255,255,0.16)'
                );
                pushCylinder(6.5, 4.5, 11, 16,
                    a => `hsl(210, 28%, ${80 + Math.cos(a) * 16}%)`,
                    67
                );

                // 8. Surgical-Grade Beveled Stainless-Steel Needle
                pushCylinder(2.1, 0.7, 74, 12,
                    a => `hsl(210, 32%, ${84 + Math.cos(a) * 15}%)`,
                    108
                );

                // Painter's Algorithm Depth Sorting (Back-to-Front)
                for (const poly of scenePolys) {
                    let zSum = 0;
                    for (let i = 0; i < poly.pts.length; i++) zSum += poly.pts[i].z;
                    poly.avgZ = zSum / poly.pts.length;
                }
                scenePolys.sort((a, b) => b.avgZ - a.avgZ);

                // Soft Ambient Glow Behind Syringe
                const centerProj = project3D(toWorld({ x: 0, y: 0, z: 0 }));
                const glowRadius = 155 * scaleFactor;
                const radialGlow = ctx.createRadialGradient(
                    centerProj.x, centerProj.y, 10,
                    centerProj.x, centerProj.y, glowRadius
                );
                radialGlow.addColorStop(0, 'rgba(45, 212, 191, 0.22)');
                radialGlow.addColorStop(0.6, 'rgba(0, 180, 162, 0.07)');
                radialGlow.addColorStop(1, 'rgba(10, 25, 47, 0)');
                ctx.fillStyle = radialGlow;
                ctx.beginPath();
                ctx.arc(centerProj.x, centerProj.y, glowRadius, 0, Math.PI * 2);
                ctx.fill();

                // Render Depth-Sorted Syringe Polygons
                for (const poly of scenePolys) {
                    const proj = poly.pts.map(p => project3D(p));
                    ctx.beginPath();
                    ctx.moveTo(proj[0].x, proj[0].y);
                    for (let i = 1; i < proj.length; i++) {
                        ctx.lineTo(proj[i].x, proj[i].y);
                    }
                    ctx.closePath();
                    ctx.fillStyle = poly.fill;
                    ctx.fill();
                    if (poly.stroke) {
                        ctx.strokeStyle = poly.stroke;
                        ctx.lineWidth = 0.75;
                        ctx.stroke();
                    }
                }

                // Calibrated Volumetric Graduation Markings (1ml - 5ml) on Front Barrel Surface
                const tickLevels = [-46, -33, -20, -7, 6, 19, 32];
                ctx.lineCap = 'round';
                tickLevels.forEach((yTick, idx) => {
                    const isMajor = idx % 2 === 0;
                    const spanAngle = isMajor ? 0.42 : 0.24;
                    const rTick = 21.8;
                    const pStart = project3D(toWorld({
                        x: Math.sin(-spanAngle) * rTick,
                        y: yTick,
                        z: -Math.cos(-spanAngle) * rTick
                    }));
                    const pEnd = project3D(toWorld({
                        x: Math.sin(spanAngle) * rTick,
                        y: yTick,
                        z: -Math.cos(spanAngle) * rTick
                    }));

                    ctx.beginPath();
                    ctx.moveTo(pStart.x, pStart.y);
                    ctx.lineTo(pEnd.x, pEnd.y);
                    ctx.strokeStyle = isMajor ? 'rgba(255, 255, 255, 0.78)' : 'rgba(255, 255, 255, 0.45)';
                    ctx.lineWidth = isMajor ? 1.6 : 1.1;
                    ctx.stroke();
                });
            }

            hero3DAnimId = requestAnimationFrame(renderFrame);
        }

        function init3DCardTilt() {
            document.querySelectorAll('.tilt-3d-card').forEach(card => {
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = (e.clientX - rect.left) / rect.width - 0.5;
                    const y = (e.clientY - rect.top) / rect.height - 0.5;
                    card.style.transform = `perspective(900px) rotateX(${(-y * 8).toFixed(2)}deg) rotateY(${(x * 8).toFixed(2)}deg) translateY(-4px)`;
                });
                card.addEventListener('mouseleave', () => {
                    card.style.transform = 'perspective(900px) rotateX(0deg) rotateY(0deg) translateY(0px)';
                });
            });
        }

        function initScrollAnimations() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        // Trigger numeric count-up if element contains stat-counter
                        const counter = entry.target.querySelector('.stat-counter');
                        if (counter && !counter.dataset.animated) {
                            counter.dataset.animated = 'true';
                            const target = parseFloat(counter.dataset.target);
                            const isDecimal = target % 1 !== 0;
                            const duration = 1400;
                            const startTime = performance.now();

                            function step(now) {
                                const progress = Math.min((now - startTime) / duration, 1);
                                const eased = 1 - Math.pow(1 - progress, 3);
                                const current = target * eased;
                                counter.textContent = isDecimal ? current.toFixed(1) : Math.floor(current).toLocaleString();
                                if (progress < 1) requestAnimationFrame(step);
                                else counter.textContent = isDecimal ? target.toFixed(1) : target.toLocaleString();
                            }
                            requestAnimationFrame(step);
                        }
                    }
                });
            }, { threshold: 0.14 });

            document.querySelectorAll('.reveal-on-scroll').forEach(el => observer.observe(el));
        }

        function renderApp() {
            const appRoot = document.getElementById('app');
            if (!store.session) {
                appRoot.innerHTML = renderPublicLanding();
                initScrollAnimations();
                initHero3DScene();
                init3DCardTilt();
            } else {
                appRoot.innerHTML = renderAuthenticatedWorkspace();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });
    </script>
